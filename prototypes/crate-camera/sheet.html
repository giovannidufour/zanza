<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Crate photo sheet 7"</title>
<style>
  @page { size: 210mm 297mm; margin: 0; }
  html, body { margin: 0; }
  body { width: 210mm; height: 297mm; font-family: Inter, sans-serif; }
  svg { display: block; width: 210mm; height: 297mm; }

<!-- 1 unit = 1 mm. Only four 7 mm markers, centred at (±80, ±120) mm from the sheet centre (105, 148.5):
     far above and below the 180 mm full crop, so nothing printed ends up in the photos.
     The page finds the record and centres the crops by itself. -->
<svg viewBox="0 0 210 297" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(105 148.5)">
    <rect x="-83.5" y="-123.5" width="7" height="7"/>
    <rect x="76.5" y="-123.5" width="7" height="7"/>
    <rect x="-83.5" y="116.5" width="7" height="7"/>
    <rect x="76.5" y="116.5" width="7" height="7"/>
  </g>
  <g transform="translate(40 283)" font-size="2.6" fill="#999">
    <text>HIGHMUZIK crate photo sheet · print at 100 % · this bar = 100 mm</text>
    <rect x="0" y="3" width="100" height="0.8" fill="#999"/>
  </g>
</svg>
</body></html>
