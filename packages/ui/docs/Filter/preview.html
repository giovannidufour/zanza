<!-- @dsCard group="Shop" height=420 subtitle="content · state · count" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: var(--surface-accent); color: var(--text-strong); font-family: var(--font-sans); }
  .wrap { display: flex; gap: 48px; padding: 24px; align-items: flex-start; }
  .matrix { display: grid; grid-template-columns: 110px max-content; gap: 16px 24px; align-items: center; }
  .row-hd { font: 400 12px/14px var(--font-sans); }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  var React = window.React, ReactDOM = window.ReactDOM, Z = window.Zanza;
  var h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'wrap' },
      h('div', { className: 'matrix' },
        h('div', { className: 'row-hd' }, 'label · default'), h(Z.Filter, { state: 'default', label: 'Roots', count: 7 }),
        h('div', { className: 'row-hd' }, 'label · active'), h(Z.Filter, { state: 'active', label: 'Dancehall', count: 14 }),
        h('div', { className: 'row-hd' }, 'tag · default'), h(Z.Filter, { state: 'default', content: 'tag', label: 'Rare', count: 4 }),
        h('div', { className: 'row-hd' }, 'tag · active'), h(Z.Filter, { state: 'active', content: 'tag', label: 'Killer version', count: 3 })),
      h(Z.Filters, null,
        h(Z.FilterBlock, { label: 'Genre' },
          h(Z.Filter, { name: 'genre', value: 'Dancehall', label: 'Dancehall', count: 14, defaultChecked: true }),
          h(Z.Filter, { name: 'genre', value: 'Roots', label: 'Roots', count: 7 })),
        h(Z.FilterBlock, { label: 'Format' },
          h(Z.Filter, { name: 'format', value: '7"', label: '7”', count: 21 }),
          h(Z.Filter, { name: 'format', value: '12"', label: '12”', count: 6 })))));
})();
</script>
</body>
</html>
