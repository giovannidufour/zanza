<!-- @dsCard group="Commerce" height=460 subtitle="desktop · mobile (swipe)" -->
<!doctype html>
<html data-theme="frontend">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: var(--surface-accent); color: var(--text-strong); font-family: var(--font-sans); }
  .row { display: flex; gap: 48px; padding: 24px; align-items: flex-start; }
  .frame[data-device="desktop"] { width: 331px; }
  .frame[data-device="mobile"]  { width: 374px; }
  .hd { font: 400 12px/14px var(--font-sans); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 8px; }
  .ph { width: 100%; height: 100%; background: var(--black-a16); }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  var React = window.React, ReactDOM = window.ReactDOM, Z = window.Zanza;
  var h = React.createElement;
  var svg = function (label, fill) { return 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400"><rect width="400" height="400" fill="' + fill + '"/><text x="16" y="32" font-family="Inter,sans-serif" font-size="14" fill="#000">' + label + '</text></svg>'); };
  var images = [{ src: svg('IMAGE 1 · COVER', '#c8c8c8'), alt: 'Cover' }, { src: svg('IMAGE 2 · PHOTO', '#aaaaaa'), alt: '' }];
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'row' },
    h('div', null, h('div', { className: 'hd' }, 'desktop'), h('div', { className: 'frame', 'data-device': 'desktop' }, h(Z.Gallery, { device: 'desktop', images: images }))),
    h('div', null, h('div', { className: 'hd' }, 'mobile — swipe →'), h('div', { className: 'frame', 'data-device': 'mobile' }, h(Z.Gallery, { device: 'mobile', images: images })))));
})();
</script>
</body>
</html>
