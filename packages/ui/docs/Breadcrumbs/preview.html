<!-- @dsCard group="Navigation" height=300 subtitle="items · links · current page" -->
<!doctype html>
<html data-theme="frontend">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* documentation chrome only — not part of the design system */
  html, body { margin: 0; background: var(--surface-base); color: var(--text-strong); font-family: var(--font-sans); }
  .pg { display: grid; grid-template-columns: 1fr 260px; border-bottom: 1px solid var(--black-a16); }
  .pg__canvas { padding: 24px; }
  .pg__controls { border-left: 1px solid var(--black-a16); padding: 16px; display: grid; gap: 12px; align-content: start; font-size: 12px; line-height: 14px; }
  .pg__controls h3 { margin: 0 0 4px; font: 400 12px/14px var(--font-sans); letter-spacing: .1em; text-transform: uppercase; }
  .ctl { display: grid; grid-template-columns: 72px 1fr; align-items: center; gap: 8px; }
  .ctl input[type=text] { font: inherit; color: var(--text-strong); background: var(--white); border: 1px solid var(--black); border-radius: 0; padding: 4px 6px; width: 100%; box-sizing: border-box; }
  .ctl input[type=checkbox] { justify-self: start; margin: 0; }
  .code { margin: 0; padding: 12px 16px; background: var(--black); color: var(--white); font: 12px/18px ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; overflow-x: auto; }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  var React = window.React, ReactDOM = window.ReactDOM, Z = window.Zanza;
  var h = React.createElement, useState = React.useState;

  function Text(p) {
    return h('div', { className: 'ctl' }, h('label', { htmlFor: p.id }, p.label),
      h('input', { id: p.id, type: 'text', value: p.value, onChange: function (e) { p.onChange(e.target.value); } }));
  }
  function Check(p) {
    return h('div', { className: 'ctl' }, h('label', { htmlFor: p.id }, p.label),
      h('input', { id: p.id, type: 'checkbox', checked: p.value, onChange: function (e) { p.onChange(e.target.checked); } }));
  }

  function Playground() {
    var st = useState({ items: 'For sale, Dancehall, 7”', links: true });
    var s = st[0], set = st[1];
    var upd = function (k) { return function (v) { var n = Object.assign({}, s); n[k] = v; set(n); }; };
    var labels = s.items.split(',').map(function (x) { return x.trim(); }).filter(Boolean);
    var items = labels.map(function (l, i) { return s.links && i === 0 ? { label: l, href: '#' } : { label: l }; });
    var snippet = '<Breadcrumbs items={[\n' + items.map(function (it) {
      return '  { label: "' + it.label + '"' + (it.href ? ', href: "' + it.href + '"' : '') + ' }';
    }).join(',\n') + '\n]} />';
    return h(React.Fragment, null,
      h('div', { className: 'pg' },
        h('div', { className: 'pg__canvas' }, h(Z.Breadcrumbs, { items: items })),
        h('div', { className: 'pg__controls' },
          h('h3', null, 'Props'),
          h(Text, { id: 'items', label: 'items (csv)', value: s.items, onChange: upd('items') }),
          h(Check, { id: 'links', label: 'first is link', value: s.links, onChange: upd('links') }))),
      h('pre', { className: 'code' }, snippet));
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h(Playground));
})();
</script>
</body>
</html>
