<!doctype html>
<html data-theme="frontend">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: var(--surface-accent); color: var(--text-strong); font-family: var(--font-sans); }
  .matrix { display: grid; grid-template-columns: 100px 315px; gap: 16px 24px; align-items: center; padding: 24px; }
  .row-hd { font: 400 12px/14px var(--font-sans); }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  var React = window.React, ReactDOM = window.ReactDOM, Z = window.Zanza;
  var h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'matrix' },
      ['default', 'hover'].map(function (st) {
        return [h('div', { key: st + 'h', className: 'row-hd' }, st),
          h(Z.ProductReturnCard, { key: st, state: st, name: '10cc - The Things We Do For Love / Hot To Trot', price: '3€', 'aria-label': 'Back to 10cc - The Things We Do For Love' })];
      })));
})();
</script>
</body>
</html>
