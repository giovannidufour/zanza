<!-- @dsCard group="Content" height=360 subtitle="Tag · TagGroup · 3 sizes" -->
<!doctype html>
<html data-theme="frontend">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* documentation chrome only — not part of the design system */
  html, body { margin: 0; background: var(--surface-accent); color: var(--text-strong); font-family: var(--font-sans); }
  .pg { display: grid; grid-template-columns: 1fr 260px; border-bottom: 1px solid var(--black-a16); }
  .pg__canvas { padding: 24px; display: flex; align-items: flex-start; }
  .pg__controls { border-left: 1px solid var(--black-a16); padding: 16px; display: grid; gap: 12px; align-content: start; font-size: 12px; line-height: 14px; }
  .pg__controls h3 { margin: 0 0 4px; font: 400 12px/14px var(--font-sans); letter-spacing: .1em; text-transform: uppercase; }
  .ctl { display: grid; grid-template-columns: 72px 1fr; align-items: center; gap: 8px; }
  .ctl select, .ctl input[type=text] { font: inherit; color: var(--text-strong); background: var(--white); border: 1px solid var(--black); border-radius: 0; padding: 4px 6px; width: 100%; box-sizing: border-box; }
  .code { margin: 0; padding: 12px 16px; background: var(--black); color: var(--white); font: 12px/18px ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; overflow-x: auto; }
  .matrix { display: grid; grid-template-columns: 100px max-content; gap: 16px 24px; align-items: center; padding: 24px; }
  .row-hd { font: 400 12px/14px var(--font-sans); }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  var React = window.React, ReactDOM = window.ReactDOM, Z = window.Zanza;
  var h = React.createElement, useState = React.useState;

  function Select(p) {
    return h('div', { className: 'ctl' }, h('label', { htmlFor: p.id }, p.label),
      h('select', { id: p.id, value: p.value, onChange: function (e) { p.onChange(e.target.value); } },
        p.options.map(function (o) { return h('option', { key: o, value: o }, o); })));
  }
  function Text(p) {
    return h('div', { className: 'ctl' }, h('label', { htmlFor: p.id }, p.label),
      h('input', { id: p.id, type: 'text', value: p.value, onChange: function (e) { p.onChange(e.target.value); } }));
  }

  function Playground() {
    var st = useState({ size: 'small', tags: 'Dancehall, 7”, JA' });
    var s = st[0], set = st[1];
    var upd = function (k) { return function (v) { var n = Object.assign({}, s); n[k] = v; set(n); }; };
    var labels = s.tags.split(',').map(function (x) { return x.trim(); }).filter(Boolean);
    var snippet = '<TagGroup>\n' + labels.map(function (l) {
      return '  <Tag' + (s.size !== 'small' ? ' size="' + s.size + '"' : '') + '>' + l + '</Tag>';
    }).join('\n') + '\n</TagGroup>';
    return h(React.Fragment, null,
      h('div', { className: 'pg' },
        h('div', { className: 'pg__canvas' },
          h(Z.TagGroup, null, labels.map(function (l, i) { return h(Z.Tag, { key: i, size: s.size }, l); }))),
        h('div', { className: 'pg__controls' },
          h('h3', null, 'Props'),
          h(Select, { id: 'size', label: 'size', value: s.size, options: ['extra-small', 'small', 'medium', 'large'], onChange: upd('size') }),
          h(Text, { id: 'tags', label: 'tags (csv)', value: s.tags, onChange: upd('tags') }))),
      h('pre', { className: 'code' }, snippet));
  }

  function Matrix() {
    var sizes = ['extra-small', 'small', 'medium', 'large'];
    var cells = [];
    sizes.forEach(function (sz) {
      cells.push(h('div', { key: 'h' + sz, className: 'row-hd' }, sz));
      cells.push(h(Z.Tag, { key: 't' + sz, size: sz }, 'Dancehall'));
    });
    return h('div', { className: 'matrix' }, cells);
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null, h(Playground), h(Matrix)));
})();
</script>
</body>
</html>
