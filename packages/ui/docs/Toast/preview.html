<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: var(--surface-accent); color: var(--text-strong); font-family: var(--font-sans); }
  .wrap { padding: 24px; display: flex; flex-direction: column; gap: 16px; width: 360px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  var React = window.React, ReactDOM = window.ReactDOM, Z = window.Zanza;
  var h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'wrap' },
      h(Z.Toast, { message: 'Removed from bag.', actionLabel: 'Undo' }),
      h(Z.Toast, { message: '3 listings archived.', actionLabel: 'Undo' }),
      h(Z.Toast, { message: 'Undone.' })));
})();
</script>
</body>
</html>
