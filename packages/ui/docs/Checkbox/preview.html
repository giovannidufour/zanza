<!doctype html>
<html data-theme="backend">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: var(--surface-accent); color: var(--text-strong); font-family: var(--font-sans); }
  .matrix { display: grid; grid-template-columns: 100px max-content; gap: 16px 24px; align-items: center; padding: 24px; }
  .row-hd { font: 400 12px/14px var(--font-sans); }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  var React = window.React, ReactDOM = window.ReactDOM, Z = window.Zanza;
  var h = React.createElement, useState = React.useState;
  function Live() { var s = useState(false); return h(Z.Checkbox, { label: 'Different spelling', checked: s[0], onChange: function (e) { s[1](e.target.checked); } }); }
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'matrix' },
      h('div', { className: 'row-hd' }, 'default'), h(Z.Checkbox, { state: 'default', label: 'Different spelling' }),
      h('div', { className: 'row-hd' }, 'active'), h(Z.Checkbox, { state: 'active', label: 'Different spelling' }),
      h('div', { className: 'row-hd' }, 'live'), h(Live)));
})();
</script>
</body>
</html>
