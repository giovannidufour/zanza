# Deploys the admin (apps/admin) to Cloudflare Pages project store-admin on every push to main
# that touches the admin or the design system. Same result as `npm run deploy:admin`, without the Mac.
# Repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN      Cloudflare token with "Cloudflare Pages: Edit" on the account
#   SUPABASE_PUBLISHABLE_KEY  the publishable key of store-staging (public by design, kept out of the repo anyway)
name: Deploy admin

on:
  push:
    branches: [main]
    paths:
      - 'apps/admin/**'
      - 'packages/ui/**'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:

concurrency:
  group: deploy-admin
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        run: node apps/admin/build.js
        env:
          SUPABASE_URL: https://hhpknvyfypqipxufmbys.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@3.80.0 pages deploy apps/admin/dist --project-name store-admin --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f0c03882d690b44b376036c924b69bc7
