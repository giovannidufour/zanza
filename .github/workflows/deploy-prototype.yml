# Temporary: publishes prototypes/crate-camera as a preview of Pages project store-admin
# (https://crate-camera.store-admin-3k1.pages.dev) so Gio can try it on his iPhone. Remove before merging.
name: Deploy crate camera prototype

on:
  push:
    branches: [claude/project-thread-43kzzp]
    paths: ['prototypes/**', '.github/workflows/deploy-prototype.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy preview to Cloudflare Pages
        run: |
          export CLOUDFLARE_API_TOKEN="$(printf %s "$TOKEN" | tr -d '[:space:]')"
          npx --yes wrangler@3.80.0 pages deploy prototypes/crate-camera --project-name store-admin --branch crate-camera --commit-dirty=true
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f0c03882d690b44b376036c924b69bc7
